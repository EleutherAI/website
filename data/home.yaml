priorities:
  - key: "open-models-and-tools"
    title: "Open Models and Tools"
    url: "/research/open-models-and-data/"
    layout: "light"
    accent: "blue"
    # Rendered as a live table in place of an image. Each row: layer, descriptor, linked items.
    table:
      - layer: "Data"
        descriptor: "Openly licensed"
        items:
          - label: "The Pile"
            url: "https://pile.eleuther.ai/"
          - label: "The Common Pile"
            url: "https://huggingface.co/common-pile"
      - layer: "Code"
        descriptor: "Open source"
        items:
          - label: "GPT-NeoX"
            url: "https://github.com/EleutherAI/gpt-neox"
          - label: "lm-evaluation-harness"
            url: "https://github.com/EleutherAI/lm-evaluation-harness"
      - layer: "Models"
        descriptor: "Public, with checkpoints"
        items:
          - label: "Pythia"
            url: "https://arxiv.org/abs/2304.01373"
          - label: "GPT-NeoX-20B"
            url: "https://huggingface.co/EleutherAI/gpt-neox-20b"
          - label: "Comma"
            url: "https://huggingface.co/common-pile"
    text: |-
      Open research on large models requires open training data, open training and evaluation code, and models whose full development is public. We have built all three since 2020.

      Our datasets include the Pile and the Common Pile. Our training framework is GPT-NeoX and our evaluation framework is the LM Evaluation Harness. Model suites such as Pythia are released with their training data, code, and intermediate checkpoints. All of it is openly licensed and in use across the research community.
    links:
      - label: "Datasets"
        url: "https://huggingface.co/EleutherAI/datasets"
      - label: "Code"
        url: "https://github.com/EleutherAI"
      - label: "Models"
        url: "https://huggingface.co/EleutherAI/models"
  - key: "interpretability-over-time"
    title: "Interpretability Over Time"
    url: "/research/interpretability/"
    layout: "lead"
    accent: "green"
    image: "images/research/homepage/interpretability-over-time.svg"
    image_alt: "A training loss curve with saved checkpoints along it, one magnified to show internal structure forming"
    text: |-
      Most interpretability research studies a finished model. We study how model internals develop over the course of training, and we have argued that [a science of AI must study training dynamics](https://arxiv.org/abs/2606.06533) rather than only the final artifact.

      The Pythia suite was built for this purpose. It provides checkpoints throughout training together with the exact data each checkpoint had seen, and it is now widely used in research on learning dynamics, memorization, and how capabilities form.
    links:
      - label: "Pythia"
        url: "https://arxiv.org/abs/2304.01373"
      - label: "Don't Just Fix It in Post"
        url: "https://arxiv.org/abs/2606.06533"
  - key: "open-weight-safety"
    title: "Open-Weight Safety"
    url: "/research/open-weight-safety/"
    layout: "safety"
    accent: "violet"
    images:
      - src: "images/research/homepage/deep-ignorance-figure-1.svg"
        alt: "Deep Ignorance Figure 1: filtered models match the baseline on general capability while biothreat proxy capability stays lower through 300M tokens of adversarial fine-tuning"
    text: |-
      Once model weights are public, safeguards cannot rely on API monitoring or on post-training methods that fine-tuning can remove. We work on safety methods that remain effective when anyone can inspect and modify the model, which in practice means intervening in the training data and the training process.

      Deep Ignorance is one such method. It filters hazardous material out of pretraining data so that the model never learns it, and the resulting safeguard is substantially more resistant to adversarial fine-tuning than post-training alternatives. With FAR.AI we co-organize the Open-Weight Pretraining Safety Accelerator, which gives researchers access to the pretraining runs needed to test interventions of this kind at scale.
    links:
      - label: "Deep Ignorance"
        url: "https://arxiv.org/abs/2508.06601"
      - label: "Development Cheatsheet"
        url: "https://arxiv.org/abs/2406.16746"
  - key: "evaluation"
    title: "Evaluation"
    url: "/research/evaluation/"
    layout: "compact"
    accent: "gold"
    image: "images/research/homepage/evaluation.svg"
    image_alt: "Schematic of benchmark saturation: older benchmarks flattening against a score ceiling while newer ones still separate models"
    text: |-
      We maintain the Language Model Evaluation Harness, which is the framework behind the Open LLM Leaderboard and the standard tool for evaluating open models. Maintaining it has shown us how much reported numbers depend on details of prompting, scoring, and implementation.

      We also study evaluation itself. This includes when benchmarks saturate and stop distinguishing between models, how the age of a benchmark affects comparisons across models, and how results should be reported so that they can be compared across groups. Through the EvalEval Coalition, which we co-founded with Hugging Face and the University of Edinburgh, we work on shared evaluation infrastructure with other institutions.
    links:
      - label: "LM Evaluation Harness"
        url: "https://github.com/EleutherAI/lm-evaluation-harness"
      - label: "Benchmark Saturation"
        url: "https://arxiv.org/abs/2602.16763"
      - label: "EvalEval Coalition"
        url: "https://evalevalai.com/"

