<section class="donation-options" aria-label="Donation options" id="donate-to-eleutherai">
  <div>
  <h3>Give once</h3>
  <p>Choose your own amount.</p>
  <p><a class="button primary" href="{{ site.Data.donations.one_time }}">Make a one-time donation</a></p>
  </div>
  <div>
  <h3>Give monthly</h3>
  <p>Give automatically each month, in USD.</p>
  <div class="button-row">
    {{ range site.Data.donations.monthly }}
    <a class="button" href="{{ .url }}" aria-label="Donate {{ .amount }} US dollars per month">${{ .amount }} / month</a>
    {{ end }}
  </div>
  </div>
  <p class="donation-note">Secure payments through Stripe. An email receipt is sent automatically after each successful donation.</p>
</section>
